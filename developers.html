<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Developers — Georgian Game Community</title>
<meta name="description" content="Independent game developers and specialists working in Georgia.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;500;600&family=Noto+Serif+Georgian:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/site.css">
</head>
<body>

<main>
  <section class="section wrap" style="padding-bottom:0">
    <h1 class="page-title" data-i18n="dev.title"></h1>
    <p class="page-intro" data-i18n="dev.intro"></p>
  </section>

  <section class="wrap" style="padding-bottom:3rem">
    <div class="filters" style="grid-template-columns:1fr">
      <input type="search" id="fSearch" data-i18n-ph="f.search" autocomplete="off">
    </div>
    <div class="filters" style="grid-template-columns:repeat(2,1fr)">
      <select data-filter="role"></select>
      <select data-filter="city"></select>
      <select data-filter="available"></select>
      <select data-filter="verified"></select>
    </div>

    <div class="result-line" id="resultInfo">
      <span data-i18n="f.loading"></span>
      <button type="button" id="fReset" data-i18n="f.reset"></button>
    </div>

    <div class="cards" id="grid"></div>

    <div class="cta-band">
      <div>
        <h3 style="font-size:1.15rem" data-i18n="cta.add.h"></h3>
        <p style="margin-top:0.35rem" data-i18n="cta.add.p"></p>
      </div>
      <a class="btn btn-primary"
         href="https://docs.google.com/forms/d/e/1FAIpQLSe0C0i0OYRaXm83_OP09H1syTPIIdqDREE5TnwCc-AbcY32Vg/viewform"
         target="_blank" rel="noopener" data-i18n="cta.add.btn"></a>
    </div>
  </section>
</main>

<script src="/assets/js/i18n.js"></script>
<script src="/assets/js/site.js"></script>
<script src="/assets/js/directory.js"></script>
<script>
initSite();
initDirectory("developers");
</script>
</body>
</html>
