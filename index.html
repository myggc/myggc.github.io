<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/assets/img/favicon.png"><!-- REPLACE WITH REAL IMAGE: 32x32 or 64x64 png of the logo -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/site.css">
<title>Georgian Game Community — ქართული თამაშების საზოგადოება</title>
<meta name="description" content="A community for everyone making games in Georgia. Studios, teams, developers, and the games they make.">
<meta property="og:title" content="Georgian Game Community">
<meta property="og:description" content="A community for everyone making games in Georgia.">
<meta property="og:image" content="https://myggc.github.io/assets/img/og.png"><!-- REPLACE WITH REAL IMAGE: 1200x630 png -->
<meta property="og:url" content="https://myggc.github.io">
</head>
<body>

<main>
  <section class="hero">
    <div class="hero-petals" id="heroPetals" aria-hidden="true"></div>
    <div class="wrap hero-in">
      <h1 class="rv d1"><span data-i18n="home.w1"></span> <em data-i18n="home.w2"></em> <span data-i18n="home.w3"></span></h1>
      <p class="lede rv d2" data-i18n="home.sub"></p>
      <div class="hero-cta rv d3">
        <a class="btn btn-accent" href="/join.html" data-i18n="nav.join"></a>
        <a class="btn btn-light" href="/companies.html" data-i18n="home.cta.companies"></a>
      </div>
      <div class="counts rv d4" id="counts">
        <a href="/companies.html" data-c="companies"><b>—</b><span class="lbl" data-i18n="count.companies"></span><span class="ver"></span></a>
        <a href="/companies.html" data-c="teams"><b>—</b><span class="lbl" data-i18n="count.teams.short"></span><span class="ver"></span></a>
        <a href="/games.html" data-c="games"><b>—</b><span class="lbl" data-i18n="count.games"></span><span class="ver"></span></a>
        <a href="/developers.html" data-c="devs"><b>—</b><span class="lbl" data-i18n="count.devs"></span><span class="ver"></span></a>
      </div>
    </div>
    <div class="stripe" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  </section>

  <section class="section alt">
    <div class="wrap">
      <div class="section-head">
        <span class="eyebrow" data-i18n="home.do.title"></span>
        <h2 data-i18n="home.map.title"></h2>
        <p data-i18n="home.map.p"></p>
      </div>
      <div class="grid3" id="doGrid"></div>
    </div>
  </section>

  <section class="section">
    <div class="wrap">
      <div class="section-head">
        <h2 data-i18n="home.shots"></h2>
        <p data-i18n="home.shots.p"></p>
      </div>
      <!-- REPLACE WITH REAL IMAGES: drop photos into /assets/img/ and set the src below.
           Recommended 1200x900 png or jpg. The gradient placeholder shows until then. -->
      <div class="shots">
        <div class="shot"><img src="/assets/img/event-1.png" alt="" onerror="this.remove()"><div class="ph">assets/img/event-1.png</div></div>
        <div class="shot"><img src="/assets/img/event-2.png" alt="" onerror="this.remove()"><div class="ph">assets/img/event-2.png</div></div>
        <div class="shot"><img src="/assets/img/event-3.png" alt="" onerror="this.remove()"><div class="ph">assets/img/event-3.png</div></div>
        <div class="shot"><img src="/assets/img/event-4.png" alt="" onerror="this.remove()"><div class="ph">assets/img/event-4.png</div></div>
      </div>
    </div>
  </section>

  <section class="section alt">
    <div class="wrap">
      <div class="section-head">
        <span class="eyebrow">GGC</span>
        <h2 data-i18n="home.playtitle"></h2>
        <p data-i18n="home.playintro"></p>
      </div>
      <div class="game-wrap">
        <div class="game-bar">
          <div class="game-score"><span data-i18n="game.score"></span>: <b id="gameScore">0</b> &nbsp; <span data-i18n="game.best"></span>: <b id="gameBest">0</b></div>
          <button class="btn btn-primary" type="button" id="gameBtn" data-i18n="game.start"></button>
        </div>
        <canvas id="gameCanvas" aria-label="GGC minigame"></canvas>
        <p class="game-hint" data-i18n="game.tap"></p>
      </div>
    </div>
  </section>
</main>

<script src="/assets/js/i18n.js"></script>
<script src="/assets/js/ui.js"></script>
<script src="/assets/js/site.js"></script>
<script src="/assets/js/game.js"></script>
<script>
initSite();

/* decorative logo petals behind the hero */
document.getElementById("heroPetals").innerHTML =
  '<div style="position:absolute;top:-4rem;right:-3rem">'+ggcLogo(340,"spin-slow")+'</div>'+
  '<div style="position:absolute;bottom:-6rem;left:-4rem">'+ggcLogo(220)+'</div>';

/* what we do */
const DO = [
  ["home.do.1.h","home.do.1.p"],
  ["home.do.2.h","home.do.2.p"],
  ["home.do.3.h","home.do.3.p"]
];
function paintDo(){
  document.getElementById("doGrid").innerHTML = DO.map(([h,p],i) =>
    '<div class="feature">'+ggcLogo(34)+'<h3>'+t(h)+'</h3><p>'+t(p)+'</p></div>').join("");
}
paintDo();
document.addEventListener("ggc:lang", paintDo);

initGame();
</script>
</body>
</html>
