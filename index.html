<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Georgian Game Community — ქართული თამაშების საზოგადოება</title>
<meta name="description" content="A community for everyone making games in Georgia. Courses, game jams, studio support, and a public directory of Georgian studios and developers.">
<meta property="og:title" content="Georgian Game Community">
<meta property="og:description" content="A community for everyone making games in Georgia.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://myggc.github.io">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;500;600&family=Noto+Serif+Georgian:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/site.css">
</head>
<body>

<main>
  <section class="hero wrap">
    <h1 class="wordmark">
      <span class="reveal d1" data-i18n="home.w1"></span>
      <span class="reveal d2" data-i18n="home.w2"></span>
      <span class="reveal d3" data-i18n="home.w3"></span>
    </h1>

    <div class="enamel reveal d4" aria-hidden="true"><i></i><i></i><i></i></div>

    <p class="hero-sub reveal d5" data-i18n="home.sub"></p>

    <div class="reveal d6" style="display:flex;gap:0.7rem;flex-wrap:wrap;margin-top:1.8rem">
      <a class="btn btn-primary" href="/companies.html" data-i18n="home.cta.companies"></a>
      <a class="btn btn-ghost" href="/about.html" data-i18n="nav.about"></a>
    </div>

    <div class="counts reveal d6" id="counts">
      <div><b data-c="companies">—</b><span data-i18n="count.companies"></span></div>
      <div><b data-c="teams">—</b><span data-i18n="count.teams"></span></div>
      <div><b data-c="devs">—</b><span data-i18n="count.devs"></span></div>
    </div>
  </section>

  <section class="section wrap">
    <div class="section-head"><h2 data-i18n="home.do.title"></h2></div>
    <div class="cols cols-3">
      <div class="topline">
        <h3 data-i18n="home.do.1.h"></h3>
        <p data-i18n="home.do.1.p"></p>
      </div>
      <div class="topline">
        <h3 data-i18n="home.do.2.h"></h3>
        <p data-i18n="home.do.2.p"></p>
      </div>
      <div class="topline">
        <h3 data-i18n="home.do.3.h"></h3>
        <p data-i18n="home.do.3.p"></p>
      </div>
    </div>
  </section>

  <section class="section wrap" style="padding-top:0">
    <div class="cols cols-2">
      <div>
        <h2 style="font-size:clamp(1.4rem,3.6vw,2rem)" data-i18n="home.map.title"></h2>
        <div class="prose" style="margin-top:0.9rem"><p data-i18n="home.map.p"></p></div>
        <div style="display:flex;gap:0.7rem;flex-wrap:wrap;margin-top:1.4rem">
          <a class="btn btn-ghost" href="/companies.html" data-i18n="nav.companies"></a>
          <a class="btn btn-ghost" href="/developers.html" data-i18n="nav.developers"></a>
        </div>
      </div>
      <div class="cta-band" style="margin-top:0;flex-direction:column;align-items:flex-start">
        <div>
          <h3 style="font-size:1.15rem" data-i18n="cta.add.h"></h3>
          <p style="margin-top:0.4rem" data-i18n="cta.add.p"></p>
        </div>
        <a class="btn btn-primary"
           href="https://docs.google.com/forms/d/e/1FAIpQLSe0C0i0OYRaXm83_OP09H1syTPIIdqDREE5TnwCc-AbcY32Vg/viewform"
           target="_blank" rel="noopener" data-i18n="cta.add.btn"></a>
      </div>
    </div>
  </section>

<script src="/assets/js/i18n.js"></script>
<script src="/assets/js/site.js"></script>
<script>initSite();</script>
