<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact — Georgian Game Community</title>
<meta name="description" content="Contact the Georgian Game Community in Tbilisi.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;500;600&family=Noto+Serif+Georgian:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/site.css">
</head>
<body>

<main>
  <section class="section wrap" style="padding-bottom:0">
    <h1 class="page-title" data-i18n="contact.title"></h1>
    <p class="page-intro" data-i18n="contact.intro"></p>
    <div class="enamel" aria-hidden="true"><i></i><i></i><i></i></div>
  </section>

  <section class="section wrap" style="padding-top:1rem">
    <div class="contact-grid">

      <div>
        <div class="contact-block" style="margin-bottom:2rem">
          <h3 data-i18n="contact.address.h"></h3>
          <p>#7 Innovations Street, Tbilisi, Georgia</p>
        </div>

        <div class="contact-block" style="margin-bottom:2rem">
          <h3 data-i18n="contact.email.h"></h3>
          <a href="mailto:georgiangamecommunity@gmail.com">georgiangamecommunity@gmail.com</a>
        </div>

        <div class="contact-block">
          <h3 data-i18n="contact.phone.h"></h3>
          <ul class="contact-list">
            <li><a href="tel:+995511154066">+995 511 15 40 66</a> <span style="opacity:.55">— Giorgi</span></li>
            <li><a href="tel:+995577233711">+995 577 23 37 11</a> <span style="opacity:.55">— Saba</span></li>
          </ul>
        </div>
      </div>

      <div>
        <div class="contact-block" style="margin-bottom:2rem">
          <h3 data-i18n="contact.join.h"></h3>
          <p data-i18n="contact.join.p"></p>
          <div style="margin-top:0.9rem">
            <a class="btn btn-primary" href="https://t.me/GeorgianGameCommunity" target="_blank" rel="noopener">Telegram</a>
          </div>
        </div>

        <div class="contact-block" style="margin-bottom:2rem">
          <h3 data-i18n="contact.social.h"></h3>
          <div class="socials">
            <a href="https://youtube.com/@ggc_geo" target="_blank" rel="noopener">YouTube</a>
            <a href="https://www.facebook.com/share/1JN4PdkHES/" target="_blank" rel="noopener">Facebook</a>
            <a href="https://www.instagram.com/ggc_geo" target="_blank" rel="noopener">Instagram</a>
            <a href="https://www.tiktok.com/@ggc_geo" target="_blank" rel="noopener">TikTok</a>
          </div>
        </div>

        <div class="contact-block">
          <h3 data-i18n="cta.add.h"></h3>
          <p data-i18n="cta.add.p"></p>
          <div style="margin-top:0.9rem">
            <a class="btn btn-ghost"
               href="https://docs.google.com/forms/d/e/1FAIpQLSe0C0i0OYRaXm83_OP09H1syTPIIdqDREE5TnwCc-AbcY32Vg/viewform"
               target="_blank" rel="noopener" data-i18n="cta.add.btn"></a>
          </div>
        </div>
      </div>

    </div>
  </section>
</main>

<script src="/assets/js/i18n.js"></script>
