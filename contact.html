<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/assets/img/favicon.png"><!-- REPLACE WITH REAL IMAGE -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/site.css">
<title>Contact — Georgian Game Community</title>
</head>
<body>

<main>
  <section class="page-head">
    <div class="wrap">
      <h1 class="page-title" data-i18n="contact.title"></h1>
      <p class="page-intro" data-i18n="contact.intro"></p>
    </div>
  </section>

  <section class="section">
    <div class="wrap contact-grid">
      <div class="panel-card">
        <div class="contact-block" style="margin-bottom:1.6rem">
          <h3 data-i18n="contact.address.h"></h3>
          <p style="margin:0;color:var(--muted)" id="cAddr"></p>
        </div>
        <div class="contact-block" style="margin-bottom:1.6rem">
          <h3 data-i18n="contact.email.h"></h3>
          <ul class="contact-list" id="cMail"></ul>
        </div>
        <div class="contact-block">
          <h3 data-i18n="contact.phone.h"></h3>
          <ul class="contact-list" id="cPhone"></ul>
        </div>
      </div>

      <div>
        <div class="panel-card" style="margin-bottom:1.2rem">
          <h3 data-i18n="contact.join.h"></h3>
          <p style="color:var(--muted)" data-i18n="contact.join.p"></p>
          <a class="btn btn-primary" href="https://t.me/GeorgianGameCommunity" target="_blank" rel="noopener">Telegram</a>
        </div>
        <div class="panel-card" style="margin-bottom:1.2rem">
          <h3 data-i18n="contact.social.h"></h3>
          <div class="socials" id="cSocial" style="margin-top:.8rem"></div>
        </div>
        <div class="panel-card">
          <h3 data-i18n="cta.add.h"></h3>
          <p style="color:var(--muted)" data-i18n="cta.add.p"></p>
          <a class="btn btn-accent" href="/join.html" data-i18n="cta.add.btn"></a>
        </div>
      </div>
    </div>
  </section>
</main>

<script src="/assets/js/i18n.js"></script>
<script src="/assets/js/ui.js"></script>
<script src="/assets/js/site.js"></script>
<script src="/assets/js/directory.js"></script>
<script>
initSite();
document.getElementById("cAddr").textContent = CONTACT.address;
document.getElementById("cMail").innerHTML =
  '<li><a href="mailto:'+CONTACT.email+'">'+CONTACT.email+'</a></li>';
document.getElementById("cPhone").innerHTML = CONTACT.phones
  .map(([n,who]) => '<li><a href="tel:'+n.replace(/\s/g,"")+'">'+n+'</a> <span style="color:var(--muted)">— '+who+'</span></li>').join("");
document.getElementById("cSocial").innerHTML = socialButtons(SOCIAL);
</script>
</body>
</html>
