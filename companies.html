<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/assets/img/favicon.png"><!-- REPLACE WITH REAL IMAGE -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/site.css">
<title>Georgian Game Community</title>
</head>
<body>

<main>
  <section class="page-head">
    <div class="wrap">
      <h1 class="page-title" data-i18n="co.title"></h1>
      <p class="page-intro" data-i18n="co.intro"></p>
    </div>
  </section>

  <section class="section">
    <div class="wrap">
      <div class="filters">
        <input type="search" id="fSearch" data-i18n-ph="f.search" autocomplete="off">
        <select data-filter="entity"></select>
        <select data-filter="role"></select>
        <select data-filter="origin"></select>
        <select data-filter="city"></select>
        <select data-filter="size"></select>
        <select data-filter="verified"></select>
      </div>
      <div class="result-line" id="resultInfo">
        <span data-i18n="f.loading"></span>
        <button type="button" id="fReset" data-i18n="f.reset"></button>
      </div>
      <div id="grid"></div>
      <div class="cta-band">
        <div>
          <h3 data-i18n="cta.add.h"></h3>
          <p data-i18n="cta.add.p"></p>
        </div>
        <a class="btn btn-accent" href="/join.html" data-i18n="cta.add.btn"></a>
      </div>
    </div>
  </section>
</main>

<script src="/assets/js/i18n.js"></script>
<script src="/assets/js/ui.js"></script>
<script src="/assets/js/site.js"></script>
<script src="/assets/js/directory.js"></script>
<script>
initSite();
initDirectory("companies");
</script>
</body>
</html>
